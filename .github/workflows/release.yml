name: Release

# Build the installer and publish it to a GitHub Release when a version tag is pushed.
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Native AOT compiles to machine code and links with MSVC, so the runner needs the C++
      # toolchain. windows-latest ships it, but not the vswhere path AOT uses to find it - build.ps1
      # puts that on PATH itself.

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Verify the renderer
        shell: pwsh
        run: pwsh -NoProfile -File build.ps1 test

      - name: Build installer
        shell: pwsh
        run: pwsh -NoProfile -File build.ps1 installer -Version ${{ steps.version.outputs.value }}

      # The in-app updater runs an installer only when its SHA-256 carries this signature; the
      # private key lives in the repository secrets and the app holds the public half. A missing
      # secret fails the release rather than publishing an installer no copy of the app will accept.
      - name: Sign installer
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw "UPDATE_SIGNING_KEY is not set." }
          $name = "NexusShot-${{ steps.version.outputs.value }}.exe"
          $key = [System.Security.Cryptography.ECDsa]::Create()
          $read = 0
          $key.ImportPkcs8PrivateKey([Convert]::FromBase64String($env:UPDATE_SIGNING_KEY), [ref]$read)
          $digest = [System.Security.Cryptography.SHA256]::HashData([System.IO.File]::ReadAllBytes("dist/$name"))
          Set-Content -Path "dist/$name.sig" -Value ([Convert]::ToBase64String($key.SignHash($digest))) -NoNewline
          $hash = [Convert]::ToHexString($digest).ToLowerInvariant()
          Set-Content -Path "dist/$name.sha256" -Value "$hash  $name" -NoNewline

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/NexusShot-${{ steps.version.outputs.value }}.exe
            dist/NexusShot-${{ steps.version.outputs.value }}.exe.sig
            dist/NexusShot-${{ steps.version.outputs.value }}.exe.sha256
          generate_release_notes: true
